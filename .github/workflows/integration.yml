name: Integration

# The box-only, self-contained live suite (tests/test_simple.py). The box links no
# network driver and needs no `fabricd` sidecar or `../fabricd` checkout: the only
# backend is a local httpbin for the HTTP `api` tests (real-driver conformance lives
# in the `fabricd` repo, asserted against this repo's `runlet-wire` contract). The
# Python harness starts its own server (cargo run) and self-skips anything it can't
# probe. Runs on every PR/push AND is reused as a release gate (`workflow_call`) so an
# image can never ship without the end-to-end suite passing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: box live suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The box's ONLY test backend: a local httpbin for the HTTP `api` tests. The
      # driver backends (Postgres/CockroachDB/NATS/…) moved to the `fabricd` repo with
      # the driver-conformance suite, so they are not started — and not needed — here.
      - name: Start httpbin
        run: docker compose up -d --wait httpbin

      # Warm the build so the harness's `cargo run` starts promptly.
      - name: Pre-build server
        run: cargo build -p runlet

      - name: Run box live suite
        run: python tests/test_simple.py

      - name: Dump httpbin logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
