[package]
name = "runlet-bench"
description = "Microbenchmarks for runlet-core internals (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Benches the raw QuickJS declare-vs-load primitives that runlet-core's `bytecode-cache`
# trades on (see runlet-core `engine.rs`: `obtain_declared` / `load_bytecode`).
rquickjs.workspace = true
# The `mux` bench drives the real `LogicHost`/capability-mux hot path through the public API.
# `default-features = false` keeps the bench light — the mux/host/engine need no network stack,
# so this pulls no `reqwest`/`aws-lc-sys` (the deterministic-only core).
runlet-core = { path = "../runlet-core", default-features = false }
# Global-allocator A/B for the sweep bin: musl's malloc serializes QuickJS's heavy per-eval
# alloc/free under threads; mimalloc is the scalable-allocator hypothesis test.
mimalloc = "0.1"

[dev-dependencies]
# HTML/plotting backend trimmed to keep the dev-dep graph small.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "bytecode"
harness = false

[[bench]]
name = "context"
harness = false

# Throughput/concurrency sweep (compute-scaling + I/O worker lever) — a bin, not a bench, since it
# measures aggregate req/s under N threads rather than single-op latency.
[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"

[[bench]]
name = "mux"
harness = false

[[bench]]
name = "batch"
harness = false

# Intentionally NOT `[lints] workspace = true`: this is dev-only benchmark scaffolding, exempt
# from the production gauntlet (criterion's macros generate undocumented items, the harness
# uses `unsafe Module::load` by design, etc.). Default lint levels apply.
